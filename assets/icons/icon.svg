<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="70%" stop-color="#0f0707" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#dc2626" stroke-width="8" opacity="0.85" />

  <!-- CRT scanlines subtle -->
  <path d="M 0 64 L 512 64 M 0 128 L 512 128 M 0 192 L 512 192 M 0 256 L 512 256 M 0 320 L 512 320 M 0 384 L 512 384 M 0 448 L 512 448" stroke="#000000" stroke-width="2" opacity="0.4" />

  <!-- Bear Silhouette Head & Ears -->
  <g fill="#171212">
    <!-- Left Ear -->
    <circle cx="150" cy="140" r="54" />
    <circle cx="150" cy="140" r="34" fill="#3f1414" />
    <!-- Right Ear -->
    <circle cx="362" cy="140" r="54" />
    <circle cx="362" cy="140" r="34" fill="#3f1414" />
    <!-- Top Hat -->
    <rect x="216" y="60" width="80" height="70" rx="6" fill="#0a0a0a" />
    <rect x="190" y="120" width="132" height="16" rx="4" fill="#0a0a0a" />
    <rect x="216" y="112" width="80" height="10" fill="#dc2626" />
    <!-- Main Head -->
    <ellipse cx="256" cy="270" rx="140" ry="120" />
    <!-- Muzzle -->
    <ellipse cx="256" cy="320" rx="84" ry="58" fill="#241919" />
    <!-- Nose -->
    <polygon points="256,290 236,312 276,312" fill="#050505" />
    <!-- Jaws / Teeth -->
    <rect x="220" y="340" width="16" height="18" rx="2" fill="#e5e5e5" />
    <rect x="248" y="340" width="16" height="18" rx="2" fill="#e5e5e5" />
    <rect x="276" y="340" width="16" height="18" rx="2" fill="#e5e5e5" />
  </g>

  <!-- Menacing Glowing Red Eyes -->
  <g filter="url(#eyeGlow)">
    <!-- Left Eye -->
    <circle cx="196" cy="240" r="22" fill="#ff1a1a" />
    <circle cx="196" cy="240" r="8" fill="#ffffff" />
    <!-- Right Eye -->
    <circle cx="316" cy="240" r="22" fill="#ff1a1a" />
    <circle cx="316" cy="240" r="8" fill="#ffffff" />
  </g>

  <!-- Title Badge Text -->
  <text x="256" y="440" font-family="monospace, sans-serif" font-weight="900" font-size="46" fill="#dc2626" text-anchor="middle" letter-spacing="6">FNAK</text>
  <text x="256" y="472" font-family="monospace, sans-serif" font-weight="700" font-size="20" fill="#a3a3a3" text-anchor="middle" letter-spacing="4">v1.0</text>
</svg>
